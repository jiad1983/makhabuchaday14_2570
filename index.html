  </head>
  <body class="bg-[#FAFAFA] text-stone-900 antialiased">
    <div id="root"></div>
    <script id="unbuilt-host-fallback">
      var __unbuiltHandled = false;
      function __handleUnbuiltEntryError() {
        if (__unbuiltHandled) return;
        __unbuiltHandled = true;
        var root = document.getElementById('root');
        if (root && root.children.length > 0) return;

        fetch('./dist/index.html', { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('missing');
            return res.text();
          })
          .then(function (html) {
            if (
              html &&
              html.length > 500 &&
              html.indexOf('id="unbuilt-host-fallback"') === -1 &&
              html.indexOf('src="/src/main.tsx"') === -1
            ) {
              window.location.replace('./dist/index.html');
              return;
            }
            throw new Error('unbuilt');
          })
          .catch(function () {
            if (!root || root.children.length > 0) return;
            root.innerHTML =
              '<div style="max-width:640px;margin:48px auto;padding:24px;border:1px solid #e7e5e4;border-radius:16px;background:#ffffff;font-family:Sarabun,sans-serif;color:#1c1917;line-height:1.7;">' +
              '<h2 style="margin:0 0 8px;color:#065f46;font-size:20px;">ไม่สามารถรันไฟล์ต้นฉบับ src/main.tsx บนเว็บโฮสต์โดยตรงได้</h2>' +
              '<p style="margin:0 0 12px;font-size:15px;">หน้านี้คือไฟล์ <code>index.html</code> สำหรับโหมดพัฒนา (ซึ่งเรียกไฟล์ TypeScript <code>/src/main.tsx</code>)</p>' +
              '<ol style="margin:0;padding-left:20px;font-size:15px;">' +
              '<li>ให้รันคำสั่ง <code>npm install && npm run build</code> บนเครื่องก่อนเพื่อสร้างโฟลเดอร์ <strong>dist/</strong></li>' +
              '<li>นำไฟล์และโฟลเดอร์ทั้งหมด<strong>ข้างในโฟลเดอร์ dist/</strong> ไปอัปโหลดลงใน <code>public_html/</code> บนโฮสต์แทนไฟล์ต้นฉบับ</li>' +
              '</ol>' +
              '</div>';
          });
      }
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && window.location.protocol === 'file:') {
          __handleUnbuiltEntryError();
        }
      }, 1500);
    </script>
    <script type="module" src="/src/main.tsx" onerror="__handleUnbuiltEntryError()"></script>
  </body>
