name: Build Plesk Deploy Branch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plesk-deploy-branch
  cancel-in-progress: true

jobs:
  build-plesk-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Publish dist/ to plesk-deploy branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build production bundle for Plesk Git ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          git branch -M plesk-deploy
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" plesk-deploy
